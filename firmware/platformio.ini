; ESP32-C3 battery temperature node
;
;   pio run -e esp32c3 -t upload            # ESP32-C3 SuperMini / DevKitM-1 (default)
;   pio run -e esp32c3-sht31 -t upload      # same, with an SHT31 instead of a DS18B20
;   pio run -e esp32dev -t upload           # classic ESP32 (easier to debug: UART stays up in sleep)
;   pio test -e native                      # buffer / policy / battery unit tests
;
; Provisioning over serial at 115200, during the first 3 s after power-on:
;   SETID:<id>   SETINT:<seconds>   SETBATCH:<n>   GETCFG

[platformio]
default_envs = esp32c3

[common]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.2.1
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    adafruit/Adafruit SHT31 Library@^2.2.2
build_flags = -Wall

[env:esp32c3]
extends = common
board = esp32-c3-devkitm-1
; Native USB CDC for Serial (without it Serial goes to UART0 and provisioning is unreachable).
build_flags = ${common.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c3-sht31]
extends = env:esp32c3
build_flags = ${env:esp32c3.build_flags} -DSENSOR_SHT31

[env:esp32dev]
extends = common
board = esp32dev
build_flags = ${common.build_flags} -DONE_WIRE_GPIO=4 -DBATTERY_ADC_GPIO=34 -DI2C_SDA_GPIO=21 -DI2C_SCL_GPIO=22

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
