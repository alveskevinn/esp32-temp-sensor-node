name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware-lint:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: firmware } }
    steps:
      - uses: actions/checkout@v4
      - run: pip install clang-format==23.1.3
      - run: find src include lib test -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror

  firmware-test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: firmware } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-native-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio test -e native

  firmware-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [esp32c3, esp32c3-sht31, esp32dev]
    defaults: { run: { working-directory: firmware } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio run -e ${{ matrix.env }}
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: firmware/.pio/build/${{ matrix.env }}/firmware.bin

  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: iot
          POSTGRES_PASSWORD: iot
          POSTGRES_DB: iot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U iot" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://iot:iot@localhost:5432/iot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: docker build -t temp-node-api .
